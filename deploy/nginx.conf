# Put limit_req_zone in the nginx http{} context, then include the server blocks.
limit_req_zone $binary_remote_addr zone=hyperlogs_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hyperlogs_ingest:10m rate=5r/s;

server {
    listen 80;
    server_name hyperlogs.example.com;
    return 301 https://hyperlogs.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name hyperlogs.example.com;
    ssl_certificate /etc/letsencrypt/live/hyperlogs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hyperlogs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    send_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location = /api/auth/login {
        limit_req zone=hyperlogs_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location = /api/ingest {
        limit_req zone=hyperlogs_ingest burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
